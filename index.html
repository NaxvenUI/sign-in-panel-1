<!DOCTYPE html>
<html lang="en">
  <head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to your account securely." />

    <link href="https://api.fontshare.com/v2/css?f[]=boska@300,400,700&f[]=satoshi@300,400,500&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />

    <title>Sign In</title>

    <link rel="stylesheet" href="assets/css/style.css">

  </head>
  <body>

    <div class="bg-orb bg-orb-1" aria-hidden="true"></div>
    <div class="bg-orb bg-orb-2" aria-hidden="true"></div>

    <main>
      <div class="card" role="main">
        <section class="panel-left" id="formPanel" aria-label="Sign in form">
          <div class="mouse-glow" id="mouseGlow" aria-hidden="true"></div>

          <header class="form-header">
            <span class="eyebrow">Welcome back</span>
            <h1>Sign <em>in.</em></h1>
          </header>

          <div class="social-row" aria-label="Sign in with a social account">
            <a href="#" class="social-btn" aria-label="Continue with Google">
              <i class="ri-google-fill"></i>
            </a>

            <a href="#" class="social-btn" aria-label="Continue with Apple">
              <i class="ri-apple-fill"></i>
            </a>

            <a href="#" class="social-btn" aria-label="Continue with GitHub">
              <i class="ri-github-fill"></i>
            </a>
          </div>

          <div class="divider" aria-hidden="true">
            <span class="divider-line"></span>
            <span class="divider-text">or continue with email</span>
            <span class="divider-line"></span>
          </div>

          <div class="form-fields">
            <div class="field-wrap">
              <input type="email" id="email" name="email" placeholder=" " autocomplete="email" required aria-required="true" />
              <label for="email">Email address</label>
            </div>

            <div class="field-wrap">
              <input type="password" id="password" name="password" placeholder=" " autocomplete="current-password" required aria-required="true" />
              <label for="password">Password</label>
            </div>
          </div>

          <div class="form-actions">
            <a href="#" class="forgot-link">Forgot password?</a>
            <button class="btn-signin" type="button">Sign In</button>
          </div>

          <p class="signup-row">No account yet? <a href="#">Create one</a></p>
        </section>

        <aside class="panel-right" aria-hidden="true">
          <div class="right-body">
            <span class="right-label">Since 2024</span>
            <h2 class="right-heading">
              Your ideas,<br /><em>fully realized.</em>
            </h2>
            <p class="right-desc">
              Pick up exactly where you left off. Everything you need, right
              here.
            </p>
            <div class="accent-line"></div>
          </div>
        </aside>
      </div>
    </main>

    <script src="assets/js/script.js" defer></script>

  </body>
</html>
